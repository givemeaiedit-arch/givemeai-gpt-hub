<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GivemeAI GPT Hub</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="aihub.css" />
    <script defer src="browser-check.js"></script>
  </head>
  <body>
    <main class="blank-shell">
      <section class="blank-card" aria-labelledby="pageTitle">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">G</span>
          <div>
            <p class="eyebrow">GivemeAI GPT Hub</p>
            <h1 id="pageTitle">พื้นที่ว่างสำหรับสร้างเว็บใหม่</h1>
          </div>
        </div>

        <p class="lead">
          เว็บนี้ถูกเคลียร์ระบบเดิมแล้ว เหลือเฉพาะ Google Login และระบบแจ้งเตือนให้เปิดด้วย Google Chrome
        </p>

        <div class="auth-panel" aria-live="polite">
          <button class="primary-button" id="loginButton" type="button">Login Gmail</button>
          <div class="user-badge" id="userBadge" hidden>
            <img id="userAvatar" alt="" />
            <span>
              <strong id="userName">Guest</strong>
              <small id="userStatus">เข้าสู่ระบบแล้ว</small>
            </span>
          </div>
          <button class="ghost-button" id="logoutButton" type="button" hidden>ออกจากระบบ</button>
        </div>

        <p class="helper-text" id="systemMessage">พร้อมเริ่มออกแบบเว็บใหม่จากหน้านี้</p>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
