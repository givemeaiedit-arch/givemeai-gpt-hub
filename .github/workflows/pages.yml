name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static files
        run: |
          mkdir -p dist
          cp -r assets dist/assets
          cp -r word dist/word
          cp index.html changelog.html articles.html community.html tools.html courses.html profile.html leaderboard.html lesson-1.html lesson-2.html lesson-3.html ai-check-ads.html admin.html prompts.html prompt-categories.html topup.html app.js shared-shell.js articles.js community.js profile.js profile-store.js lesson-data.js lesson-page.js leaderboard.js ai-check-ads.js admin.js prompt-data.js prompt-store.js prompts.js topup.js auth-shared.js browser-check.js firebase-config.js aihub.css dist/
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
